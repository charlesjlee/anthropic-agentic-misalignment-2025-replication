[project]
name = "datacenter-study"
version = "0.1.0"
description = "Reproduction of Anthropic's 2025 Agentic Misalignment datacenter scenario and newer-model update"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "inspect-evals",
  "httpx",
  "PyJWT[crypto]",
  "pywin32; sys_platform == 'win32'",
  "filelock",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "pytest",
    "ruff",
    "uv==0.13.6",
]

[tool.uv.sources]
inspect-evals = { git = "https://github.com/charlesjlee/inspect_evals.git", rev = "4d5a56bb16a98633a9011674251e4ddcbd49ce9f" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
